<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijos de Krebs | Fase 3: Efecto Krebs - Aparato Respiratorio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- Tone.js para efectos de sonido -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        :root {
            --cyan: #00F2FF;
            --magenta: #FF00E5;
            --dark: #050505;
            --danger: #FF0040;
            --success: #00FF00;
            --elite: #FFD700;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--dark);
            color: #ffffff;
            overflow-x: hidden;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        .neon-border-elite { border: 1px solid var(--elite); box-shadow: 0 0 20px rgba(255, 215, 0, 0.3); }

        .option-btn {
            background: rgba(34, 34, 17, 0.4);
            border: 1px solid #332211;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            border-color: var(--elite);
            background: rgba(255, 215, 0, 0.1);
            transform: translateX(5px);
        }
        .option-btn.selected-correct {
            background: rgba(0, 255, 0, 0.2) !important;
            border-color: var(--success) !important;
            color: var(--success);
        }
        .option-btn.selected-incorrect {
            background: rgba(255, 0, 64, 0.2) !important;
            border-color: var(--danger) !important;
            color: var(--danger);
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4">

    <div class="scanlines"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container" class="w-full max-w-2xl bg-[#050502] neon-border-elite p-6 sm:p-8 relative z-10 flex flex-col space-y-6 shadow-2xl fade-in">
        
        <!-- Cabecera -->
        <header class="flex justify-between items-center border-b border-[#332211] pb-4">
            <div>
                <h1 class="text-xs sm:text-sm font-bold tracking-widest text-gray-400">HIJOS DE KREBS /// <span class="text-[var(--elite)]">RESPIRATORIO: EFECTO KREBS ⚡</span></h1>
                <p id="progress-indicator" class="text-xs text-[var(--elite)] mt-1">> INTERCEPCIÓN 1 / 10 (NIVEL ÉLITE)</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">XP TOTAL</p>
                <p id="score-display" class="text-lg sm:text-xl font-bold text-[var(--elite)]">0</p>
            </div>
        </header>

        <!-- Barra de Tiempo y Estado -->
        <div class="flex justify-between items-center text-xs text-gray-400 font-bold">
            <span id="timer-text">> TIEMPO RESTANTE: <span class="text-[var(--elite)]">60s</span></span>
            <span class="text-[var(--elite)]">PROTOCOLO DE MÁXIMA EXIGENCIA</span>
        </div>
        <div class="w-full bg-gray-900 h-1.5 rounded overflow-hidden border border-[#332211]">
            <div id="timer-bar" class="bg-[var(--elite)] h-full w-full transition-all duration-1000"></div>
        </div>

        <!-- Pantalla de Pregunta -->
        <div id="quiz-screen" class="space-y-6">
            <h2 id="question-text" class="text-sm sm:text-base font-bold text-gray-200 leading-relaxed">
                Desplegando casos clínicos avanzados...
            </h2>

            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Opciones inyectadas por JS -->
            </div>
        </div>

        <!-- Pantalla Final (Resultado) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-8">
            <div id="result-icon" class="w-16 h-16 mx-auto flex items-center justify-center border-2 rounded-full text-2xl font-bold"></div>
            <h2 id="result-title" class="text-xl sm:text-2xl font-bold tracking-wider"></h2>
            <p id="result-desc" class="text-xs sm:text-sm text-gray-300 max-w-md mx-auto leading-relaxed"></p>
            
            <div id="action-container" class="pt-4 flex flex-col gap-3">
                <!-- Botón dinámico -->
            </div>
        </div>

    </main>

    <script>
        // --- BASE DE DATOS: APARATO RESPIRATORIO (FASE 3: EFECTO KREBS - DIFÍCILES) ---
        const questions = [
            {
                question: "UN RECIÉN NACIDO PREMATURO PRESENTA DIFICULTAD RESPIRATORIA AGUDA CARACTERIZADA POR EL COLAPSO ALVEOLAR MASIVO. DESDE LA PERSPECTIVA HISTOFISIOLÓGICA PULMONAR, ¿QUÉ ALTERACIÓN CELULAR ESPECÍFICA EXPLICA ESTE CUADRO CLÍNICO?",
                options: [
                    "A) LA INCAPACIDAD DE LOS NEUMOCITOS TIPO I PARA REALIZAR LA DIFUSIÓN SIMPLE DE OXÍGENO A TRAVÉS DE LA MEMBRANA.",
                    "B) LA DEFICIENTE SÍNTESIS DE SURFACTANTE POR PARTE DE LOS NEUMOCITOS TIPO II, LO QUE ELEVA LA TENSIÓN SUPERFICIAL ALVEOLAR.",
                    "C) LA HIPERPLASIA DE LAS CÉLULAS CALICIFORMES QUE BLOQUEA EL PASO DE AIRE EN LOS BRONQUIOLOS TERMINALES.",
                    "D) LA DESTRUCCIÓN AUTOINMUNE DE LOS ANILLOS DE CARTÍLAGO HIALINO EN LA TRÁQUEA Y LOS BRONQUIOS PRINCIPALES.",
                    "E) LA PARÁLISIS DEL EPITELIO CILIADO QUE IMPIDE LA ELIMINACIÓN DEL MOCO HACIA LA NASOFARINGE."
                ],
                correct: 1
            },
            {
                question: "DURANTE EL EJERCICIO FÍSICO DE ALTA INTENSIDAD, LA PRODUCCIÓN METABÓLICA DE CO₂ EN LOS MÚSCULOS AUMENTA SIGNIFICATIVAMENTE. ¿QUÉ MECANISMO ERITROCITARIO Y ENZIMÁTICO ESENCIAL PERMITE EVITAR LA ACIDOSIS EXTENSA Y FACILITAR EL TRANSPORTE SISTÉMICO DE ESTE GAS HACIA LOS PULMONES?",
                options: [
                    "A) LA UNIÓN IRREVERSIBLE DEL DIÓXIDO DE CARBONO CON LA HEMOGLOBINA PARA FORMAR OXIHEMOGLOBINA.",
                    "B) LA ACCIÓN DE LA ANHIDRASA CARBÓNICA QUE CATALIZA LA CONVERSIÓN DE CO₂ EN BICARBONATO (HCO₃⁻) DENTRO DEL ERITROCITO.",
                    "C) LA DIFUSIÓN ACTIVA DEL DIÓXIDO DE CARBONO A TRAVÉS DE LA MEMBRANA ALVEOLOCAPILAR MEDIANTE ATP.",
                    "D) LA SÍNTESIS ACELERADA DE SURFACTANTE POR LOS NEUMOCITOS TIPO I EN LOS ALVÉOLOS PULMONARES.",
                    "E) LA RETENCIÓN VOLUNTARIA DE AIRE EN LA ZONA CONDUCTORA PARA DISMINUIR LA PRESIÓN PARCIAL DE CO₂."
                ],
                correct: 1
            },
            {
                question: "UN PACIENTE INGIERE ACCIDENTALMENTE UN CUERPO EXTRAÑO PEQUEÑO EL CUAL LOGRA SOBREPASAR LA LARINGE Y LA CARINA TRAQUEAL. ANATÓMICAMENTE, ¿EN QUÉ ESTRUCTURA Y PULMÓN ES MÁS PROBABLE QUE SE ALOJE DICHO OBJETO Y POR QUÉ RAZÓN ANATÓMICA ESPECÍFICA?",
                options: [
                    "A) EN EL BRONQUIO PRINCIPAL DERECHO, DEBIDO A QUE ES MÁS VERTICAL, ANCHO Y CORTO QUE EL IZQUIERDO.",
                    "B) EN EL BRONQUIO PRINCIPAL IZQUIERDO, DEBIDO A QUE EL PULMÓN IZQUIERDO POSEE TRES LÓBULOS ANATÓMICOS.",
                    "C) EN EL BRONQUIOLO RESPIRATORIO DERECHO, PORQUE CARECE POR COMPLETO DE MÚSCULO LISO Y CILIAR.",
                    "D) EN LA LARINGOFARINGE IZQUIERDA, PORQUE LA EPIGLOTIS PERMANECE ABIERTA CONTINUAMENTE.",
                    "E) EN LOS ALVÉOLOS PULMONARES IZQUIERDOS, DEBIDO A LA AUSENCIA DE ANILLOS CARTILAGINOSOS EN FORMA DE 'C'."
                ],
                correct: 0
            },
            {
                question: "UN INDIVIDUO EXPERIMENTA UN CUADRO DE CRISIS ASMÁTICA CARACTERIZADO POR LA CONTRACCIÓN SOSTENIDA DEL MÚSCULO LISO EN LAS VÍAS AÉREAS PEQUEÑAS. ¿EN QUÉ SEGMENTO ANATÓMICO ESPECÍFICO DEL ÁRBOL RESPIRATORIO SE PRODUCE ESTA MAYOR RESISTENCIA AL FLUJO DE AIRE DEBIDO A LA AUSENCIA DE CARTÍLAGO?",
                options: [
                    "A) EN LA TRÁQUEA MEMBRANOSA.",
                    "B) EN LOS BRONQUIOS LOBARES Y SEGMENTARIOS.",
                    "C) EN LOS BRONQUIOLOS.",
                    "D) EN LAS FOSAS NASALES SUPERIORES.",
                    "E) EN LOS ANILLOS CARTILAGINOSOS LARÍNGEOS."
                ],
                correct: 2
            },
            {
                question: "SI SE PRODUCE UNA PERFORACIÓN EN LA PARED TORÁCICA QUE INGRESA A LA CAVIDAD PLEURAL, ¿QUÉ SUCEDE CON LA MECÁNICA VENTILATORIA Y LA PRESIÓN INTRATORÁCICA?",
                options: [
                    "A) LA PRESIÓN INTRATORÁCICA SE HACE MÁS NEGATIVA, PROVOCANDO UNA EXPANSIÓN EXCESIVA DEL ALVÉOLO.",
                    "B) SE PIERDE EL GRADIENTE DE PRESIÓN NEGATIVA INTRATORÁCICA, PROVOCANDO EL COLAPSO DEL PULMÓN Y LA IMPOSIBILIDAD DE VENTILAR.",
                    "C) AUMENTA EXCESIVAMENTE LA PRODUCCIÓN DE SURFACTANTE POR LOS NEUMOCITOS TIPO II EN LAS FOSAS NASALES.",
                    "D) EL MÚSCULO DIAFRAGMA SE CONTRAE DE FORMA PERMANENTE IMPIDIENDO LA ESPIRACIÓN.",
                    "E) LA ENZIMA ANHIDRASA CARBÓNICA SE INACTIVA POR COMPLETO EN EL PLASMA SANGUÍNEO."
                ],
                correct: 1
            },
            {
                question: "UN ATLETA SE SOMETE A UN ENTRENAMIENTO INTENSO DE ALTA EXIGENCIA FÍSICA. A DIFERENCIA DE LA RESPIRACIÓN TRANQUILA, ¿QUÉ MECANISMO FISIOLÓGICO ADICIONAL ACTÚA DURANTE LA ESPIRACIÓN FORZADA EN ESTE SUJETO?",
                options: [
                    "A) LA EXCLUSIVA RELAJACIÓN PASIVA DEL DIAFRAGMA Y EL RETROCESO ELÁSTICO PULMONAR.",
                    "B) LA CONTRACCIÓN ACTIVA DE MÚSCULOS ACCESORIOS PARA DISMINUIR RÁPIDAMENTE EL VOLUMEN TORÁCICO.",
                    "C) LA PARÁLISIS TEMPORAL DEL EPITELIO CILIADO TRAQUEAL PARA RETENER OXÍGENO.",
                    "D) EL INCREMENTO EN LA DIFUSIÓN ACTIVA DE CO₂ A TRAVÉS DE LOS BRONQUIOLOS TERMINALES.",
                    "E) EL CIERRE COMPLETO DE LA EPIGLOTIS PARA AUMENTAR LA TENSIÓN SUPERFICIAL ALVEOLAR."
                ],
                correct: 1
            },
            {
                question: "EVALUANDO EL PROCESO DE ACONDICIONAMIENTO DEL AIRE INSPIRADO EN UN ENTORNO CON AIRE FRÍO Y SECO, ¿CÓMO COOPERAN ESTRUCTURALMENTE LAS FOSAS NASALES Y SU MUCOSA PARA EVITAR EL DAÑO EN LOS ALVÉOLOS PULMONARES?",
                options: [
                    "A) LOS CORNETES GENERAN TURBULENCIA MIENTRAS EL MOCO Y LOS CILIOS HUMIDIFICAN, FILTRAN Y CALIENTAN EL AIRE ANTES DE LLEGAR A LA LARINGE.",
                    "B) LOS NEUMOCITOS TIPO I SINTETIZAN LISOZIMA PARA ELEVAR LA TEMPERATURA DEL AIRE A NIVEL ALVEOLAR.",
                    "C) LA ANHIDRASA CARBÓNICA OLFATORIA NEUTRALIZA LA PRESIÓN ATMOSFÉRICA DEL AIRE FRÍO.",
                    "D) EL MÚSCULO LISO OLFATORIO SE CONTRAE PARA IMPEDIR EL PASO DE AIRE HACIA LA FARINGE.",
                    "E) LOS BRONQUIOLOS RESPIRATORIOS RETIENEN EL AIRE FRÍO MEDIANTE ANILLOS DE CARTÍLAGO HIALINO."
                ],
                correct: 0
            },
            {
                question: "EN UN INDIVIDUO CON HIPERVENTILACIÓN SEVERA, SE EXPULSA EXCESIVO DIÓXIDO DE CARBONO (CO₂) POR VÍA ALVEOLAR. ¿QUÉ REACCIÓN ENZIMÁTICA Y CONSECUENCIA ÁCIDO-BASE SANGUÍNEA SE DESENCADENA SEGÚN LA FISIOLOGÍA RESPIRATORIA?",
                options: [
                    "A) SE INCREMENTA LA FORMACIÓN DE H₂CO₃ Y DISMINUYE EL pH SANGUÍNEO HASTA LA ACIDOSIS.",
                    "B) LA ANHIDRASA CARBÓNICA DESPLAZA LA REACCIÓN HACIA LA DISOCIACIÓN DEL BICARBONATO PARA REPONER EL CO₂ PERDIDO, ALTERANDO EL EQUILIBRIO ÁCIDO-BASE SANGUÍNEO.",
                    "C) LOS NEUMOCITOS TIPO II DEJAN DE PRODUCIR SURFACTANTE, PROVOCANDO LA ACUMULACIÓN DE BICARBONATO EN EL PLASMA.",
                    "D) EL O₂ COMPITE CON EL BICARBONATO HASTA INHIBIR LA FUNCIÓN DEL MÚSCULO DIAFRAGMA.",
                    "E) SE BLOQUEA EL INTERCAMBIO GASEOSO EN LA ZONA CONDUCTORA DE LA TRÁQUEA Y LOS BRONQUIOS."
                ],
                correct: 1
            },
            {
                question: "RESPECTO A LA HEMATOSIS, ¿QUÉ CARACTERÍSTICA ESTRUCTURAL DE LA MEMBRANA RESPIRATORIA ES INDISPENSABLE PARA QUE EL O₂ PASE RÁPIDAMENTE DEL ALVÉOLO A LA SANGRE Y EL CO₂ EN SENTIDO INVERSO?",
                options: [
                    "A) UN GROSOR ELEVADO DE CARTÍLAGO HIALINO EN CADA PARED ALVEOLAR.",
                    "B) UNA EXTREMADA DELGADEZ DE LA MEMBRANA ALVEOLOCAPILAR UNIDA A UN AMPLIO RED DE CAPILARES Y A LOS GRADIENTES DE PRESIÓN PARCIAL.",
                    "C) LA PRESENCIA DE CILIOS MÓVILES EN LA SUPERFICIE INTERNA DE LOS NEUMOCITOS TIPO I.",
                    "D) EL TRANSPORTE ACTIVO DE OXÍGENO MEDIADO POR ENZIMAS ANHIDRASAS CARBÓNICAS MEMBRANALES.",
                    "E) LA CONTRACCIÓN RÍTMICA DEL MÚSCULO LISO ALVEOLAR DURANTE LA ESPIRACIÓN TRANQUILA."
                ],
                correct: 1
            },
            {
                question: "UN PACIENTE PRESENTA UNA ENFERMEDAD PULMONAR QUE AFECTA ESPECÍFICAMENTE A LOS NEUMOCITOS TIPO I. ¿CUÁL SERÁ LA CONSECUENCIA FISIOLÓGICA DIRECTA EN LA FUNCIÓN PULMONAR DE ESTE INDIVIDUO?",
                options: [
                    "A) LA IMPOSIBILIDAD DE SINTETIZAR SURFACTANTE PULMONAR Y EL COLAPSO ALVEOLAR INMEDIATO.",
                    "B) LA ALTERACIÓN ESTRUCTURAL DE LA SUPERFICIE EPITELIAL ALVEOLAR DONDE OCURRE EL INTERCAMBIO GASEOSO.",
                    "C) LA PARÁLISIS COMPLETA DEL MÚSCULO DIAFRAGMA DURANTE LA INSPIRACIÓN FORZADA.",
                    "D) LA PÉRDIDA DE LOS ANILLOS CARTILAGINOSOS EN FORMA DE 'C' DE LA TRÁQUEA.",
                    "E) LA INCAPACIDAD DE LA FARINGE PARA DEGLUTIR EL BOLO ALIMENTICIO."
                ],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        let audioInit = false;
        let synth;

        function initAudio() {
            if (!audioInit) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -12;
                audioInit = true;
            }
        }

        const sfx = {
            click: () => { if(audioInit) synth.triggerAttackRelease("C6", "32n"); },
            success: () => { if(audioInit) synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n"); },
            error: () => { if(audioInit) synth.triggerAttackRelease(["C3", "F#2"], "4n"); }
        };

        function startTimer() {
            timeLeft = 60;
            document.getElementById('timer-text').innerHTML = `> TIEMPO RESTANTE: <span class="text-[var(--elite)]">${timeLeft}s</span>`;
            document.getElementById('timer-bar').style.width = '100%';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerHTML = `> TIEMPO RESTANTE: <span class="text-[var(--elite)]">${timeLeft}s</span>`;
                let percentage = (timeLeft / 60) * 100;
                document.getElementById('timer-bar').style.width = percentage + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1);
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endQuiz();
                return;
            }

            initAudio();
            startTimer();

            const q = questions[currentQuestion];
            document.getElementById('progress-indicator').innerText = `> INTERCEPCIÓN ${currentQuestion + 1} / ${questions.length} (NIVEL ÉLITE)`;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 text-left text-xs sm:text-sm font-bold text-gray-200 rounded flex justify-between items-center';
                btn.innerHTML = `<span>${opt}</span><span class="text-xs opacity-50">></span>`;
                btn.onclick = () => {
                    clearInterval(timerInterval);
                    handleAnswer(index, btn);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            sfx.click();
            const q = questions[currentQuestion];
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                if(btnElement) btnElement.classList.add('selected-correct');
                sfx.success();
                let earnedXP = 150 + (timeLeft * 3); // Más XP por ser nivel élite
                score += earnedXP;
            } else {
                if(btnElement) btnElement.classList.add('selected-incorrect');
                if(allBtns[q.correct]) allBtns[q.correct].classList.add('selected-correct');
                sfx.error();
            }

            document.getElementById('score-display').innerText = score;

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1200);
        }

        function endQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('timer-text').parentElement.classList.add('hidden');
            document.getElementById('timer-bar').parentElement.classList.add('hidden');
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');

            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const actionContainer = document.getElementById('action-container');

            // Barrera de supervivencia élite: 800 XP
            if (score >= 800) {
                // GUARDAR PROGRESO FINAL DEL MÓDULO RESPIRATORIO
                localStorage.setItem('krebs_fase3_respiratorio_ok', 'true');

                resultIcon.className = "w-16 h-16 mx-auto flex items-center justify-center border-2 border-[var(--elite)] rounded-full text-2xl font-bold text-[var(--elite)] shadow-[0_0_20px_#FFD700]";
                resultIcon.innerText = "⚡";
                resultTitle.className = "text-xl sm:text-2xl font-bold tracking-wider text-[var(--elite)]";
                resultTitle.innerText = ">> EFECTO KREBS DOMINADO";
                resultDesc.innerHTML = `¡Nivel Élite superado con éxito! Puntuación final: <span class="text-[var(--elite)] font-bold">${score} XP</span>. Has completado el 100% del Módulo de Aparato Respiratorio y desbloqueado el beneficio máximo de descuento.`;
                
                actionContainer.innerHTML = `
                    <a href="https://wa.me/51941071347?text=Hola,%20Maestro%20Antonio.%20Completé%20el%20100%25%20del%20Módulo%20de%20Aparato%20Respiratorio%20(Efecto%20Krebs)%20con%20${score}%20XP.%20Vengo%20a%20reclamar%20mi%20descuento%20máximo%20del%2030%25%20para%20el%20Pase%20Táctico." target="_blank" class="block w-full border border-[var(--elite)] bg-[var(--elite)] text-black font-bold py-4 text-center text-xs uppercase tracking-widest hover:bg-transparent hover:text-[var(--elite)] transition-colors">
                        [ RECLAMAR 30% DE DESCUENTO CON EL MAESTRO ANTONIO ]
                    </a>
                    <a href="index.html" class="block w-full border border-gray-600 bg-transparent text-gray-300 font-bold py-3 text-center text-xs uppercase tracking-widest hover:border-gray-400 transition-colors">
                        [ VOLVER A LA CENTRAL DE OPERACIONES ]
                    </a>
                `;
            } else {
                resultIcon.className = "w-16 h-16 mx-auto flex items-center justify-center border-2 border-[var(--danger)] rounded-full text-2xl font-bold text-[var(--danger)] shadow-[0_0_15px_#FF0040]";
                resultIcon.innerText = "✕";
                resultTitle.className = "text-xl sm:text-2xl font-bold tracking-wider text-[var(--danger)]";
                resultTitle.innerText = ">>BRECHA ÉLITE DETECTADA";
                resultDesc.innerHTML = `Tu puntaje final fue de <span class="text-[var(--danger)] font-bold">${score} XP</span>. El Efecto Krebs exige un puntaje mínimo de 800 XP para certificar la maestría en el módulo.`;
                
                actionContainer.innerHTML = `
                    <button onclick="location.reload()" class="w-full border border-[var(--elite)] bg-transparent text-[var(--elite)] font-bold py-4 text-center text-xs uppercase tracking-widest hover:bg-[var(--elite)] hover:text-black transition-colors">
                        [ REINTENTAR PROTOCOLO ÉLITE ]
                    </button>
                    <a href="index.html" class="block w-full border border-gray-600 bg-transparent text-gray-300 font-bold py-3 text-center text-xs uppercase tracking-widest hover:border-gray-400 transition-colors">
                        [ VOLVER A LA CENTRAL DE OPERACIONES ]
                    </a>
                `;
            }
        }

        window.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        loadQuestion();
    </script>
</body>
</html>
