<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijos de Krebs | Fase 2: Brote Mutante - Aparato Respiratorio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <!-- Tone.js para efectos de sonido -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        :root {
            --cyan: #00F2FF;
            --magenta: #FF00E5;
            --dark: #050505;
            --danger: #FF0040;
            --success: #00FF00;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--dark);
            color: #ffffff;
            overflow-x: hidden;
        }

        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        .neon-border-magenta { border: 1px solid var(--magenta); box-shadow: 0 0 15px rgba(255, 0, 229, 0.2); }

        .option-btn {
            background: rgba(17, 34, 64, 0.4);
            border: 1px solid #112240;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            border-color: var(--magenta);
            background: rgba(255, 0, 229, 0.1);
            transform: translateX(5px);
        }
        .option-btn.selected-correct {
            background: rgba(0, 255, 0, 0.2) !important;
            border-color: var(--success) !important;
            color: var(--success);
        }
        .option-btn.selected-incorrect {
            background: rgba(255, 0, 64, 0.2) !important;
            border-color: var(--danger) !important;
            color: var(--danger);
        }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-center p-4">

    <div class="scanlines"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container" class="w-full max-w-2xl bg-[#02050A] neon-border-magenta p-6 sm:p-8 relative z-10 flex flex-col space-y-6 shadow-2xl fade-in">
        
        <!-- Cabecera -->
        <header class="flex justify-between items-center border-b border-[#112240] pb-4">
            <div>
                <h1 class="text-xs sm:text-sm font-bold tracking-widest text-gray-400">HIJOS DE KREBS /// <span class="text-[var(--magenta)]">RESPIRATORIO: BROTE MUTANTE ☣️</span></h1>
                <p id="progress-indicator" class="text-xs text-[var(--cyan)] mt-1">> INTERCEPCIÓN 1 / 10</p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-400">XP TOTAL</p>
                <p id="score-display" class="text-lg sm:text-xl font-bold text-[var(--cyan)]">0</p>
            </div>
        </header>

        <!-- Barra de Tiempo y Estado -->
        <div class="flex justify-between items-center text-xs text-gray-400 font-bold">
            <span id="timer-text">> TIEMPO RESTANTE: <span class="text-[var(--cyan)]">60s</span></span>
            <span class="text-[var(--magenta)]">AMENAZA INTERMEDIA ACTIVA</span>
        </div>
        <div class="w-full bg-gray-900 h-1.5 rounded overflow-hidden border border-[#112240]">
            <div id="timer-bar" class="bg-[var(--magenta)] h-full w-full transition-all duration-1000"></div>
        </div>

        <!-- Pantalla de Pregunta -->
        <div id="quiz-screen" class="space-y-6">
            <h2 id="question-text" class="text-sm sm:text-base font-bold text-gray-200 leading-relaxed">
                Analizando vector fisiológico...
            </h2>

            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Opciones inyectadas por JS -->
            </div>
        </div>

        <!-- Pantalla Final (Resultado) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-8">
            <div id="result-icon" class="w-16 h-16 mx-auto flex items-center justify-center border-2 rounded-full text-2xl font-bold"></div>
            <h2 id="result-title" class="text-xl sm:text-2xl font-bold tracking-wider"></h2>
            <p id="result-desc" class="text-xs sm:text-sm text-gray-300 max-w-md mx-auto leading-relaxed"></p>
            
            <div id="action-container" class="pt-4 flex flex-col gap-3">
                <!-- Botón dinámico -->
            </div>
        </div>

    </main>

    <script>
        // --- BASE DE DATOS: APARATO RESPIRATORIO (FASE 2: BROTE MUTANTE) ---
        const questions = [
            {
                question: "DURANTE EL PROCESO DE INSPIRACIÓN TRANQUILA, ¿QUÉ SECUENCIA DE EVENTOS FISIOLÓGICOS PERMITE EL INGRESO DE AIRE A LOS PULMONES?",
                options: [
                    "A) LA RELAJACIÓN DEL DIAFRAGMA DISMINUYE EL VOLUMEN TORÁCICO Y AUMENTA LA PRESIÓN ALVEOLAR.",
                    "B) LA CONTRACCIÓN Y DESCENSO DEL DIAFRAGMA INCREMENTA EL VOLUMEN TORÁCICO Y REDUCE LA PRESIÓN ALVEOLAR POR DEBAJO DE LA ATMOSFÉRICA.",
                    "C) EL RETROCESO ELÁSTICO PULMONAR DISMINUYE EL VOLUMEN ALVEOLAR Y AUMENTA LA PRESIÓN ATMOSFÉRICA.",
                    "D) LA CONTRACCIÓN DE LOS MÚSCULOS ABDOMINALES ELEVA LA PRESIÓN INTRATORÁCICA Y EXPULSA EL AIRE AL EXTERIOR.",
                    "E) EL AUMENTO DE LA TENSIÓN SUPERFICIAL ALVEOLAR OBLIGA A INGRESAR AIRE POR DIFUSIÓN SIMPLE."
                ],
                correct: 1
            },
            {
                question: "¿CUÁL ES EL FACTOR FISICOQUÍMICO DETERMINANTE QUE IMPULSA EL INTERCAMBIO DE OXÍGENO Y DIÓXIDO DE CARBONO A TRAVÉS DE LA MEMBRANA ALVEOLOCAPILAR?",
                options: [
                    "A) LA CONTRACCIÓN MUSCULAR DEL MÚSCULO LISO BRONQUIAL.",
                    "B) EL TRANSPORTE ACTIVO DE GASES A TRAVÉS DE BOMBAS IÓNICAS MEMBRANALES.",
                    "C) LOS GRADIENTES DE PRESIÓN PARCIAL DE CADA GAS ENTRE EL ALVÉOLO Y LA SANGRE CAPILAR.",
                    "D) LA ACCIÓN EXCLUSIVA DE LA ENZIMA ANHIDRASA CARBÓNICA EN LA MEMBRANA.",
                    "E) EL DESPLAZAMIENTO DEL MOCO SECRETADO POR EL EPITELIO RESPIRATORIO."
                ],
                correct: 2
            },
            {
                question: "¿QUÉ ROL CUMPLE LA ENZIMA ANHIDRASA CARBÓNICA EN LA FISIOLOGÍA DEL TRANSPORTE DE GASES Y LA HOMEOSTASIS SANGUÍNEA?",
                options: [
                    "A) SINTETIZA SURFACTANTE PARA REDUCIR LA TENSIÓN SUPERFICIAL ALVEOLAR.",
                    "B) FACILITA LA INTERCONVERSIÓN RÁPIDA DE DIÓXIDO DE CARBONO Y BICARBONATO EN LOS ERITROCITOS.",
                    "C) DEGRADA LA HEMOGLOBINA PARA LIBERAR OXÍGENO MOLECULAR EN LOS TEJIDOS.",
                    "D) NEUTRALIZA EL ÁCIDO CLORHÍDRICO PRODUCIDO EN LAS FOSAS NASALES.",
                    "E) INHIBE LA ACCIÓN DE LOS NEUMOCITOS TIPO I DURANTE EL EJERCICIO FÍSICO."
                ],
                correct: 1
            },
            {
                question: "A DIFERENCIA DE LOS BRONQUIOS, LOS BRONQUIOLOS SE CARACTERIZAN ANATÓMICAMENTE Y FISIOLÓGICAMENTE POR:",
                options: [
                    "A) POSEER ABUNDANTES ANILLOS DE CARTÍLAGO HIALINO Y CARECER DE MÚSCULO LISO.",
                    "B) CARECER DE SOPORTE CARTILAGINOSO Y PRESENTAR MÚSCULO LISO QUE REGULA LA RESISTENCIA AL FLUJO DE AIRE.",
                    "C) SER LOS ÚNICOS CONDUCTOS DONDE SE SINTETIZA EL SURFACTANTE PULMONAR.",
                    "D) PRESENTAR EPITELIO OLFATORIO ESPECIALIZADO EN LA PERCEPCIÓN DE OLORES.",
                    "E) CONSTITUIR LA ÚNICA ZONA CONDUCTORA DEL SISTEMA RESPIRATORIO."
                ],
                correct: 1
            },
            {
                question: "¿CÓMO SE DIFERENCIAN FUNCIONALMENTE LA ZONA CONDUCTORA Y LA ZONA RESPIRATORIA DEL SISTEMA RESPIRATORIO HUMANO?",
                options: [
                    "A) LA ZONA CONDUCTORA REALIZA LA HEMATOSIS Y LA ZONA RESPIRATORIA CALIENTA EL AIRE.",
                    "B) LA ZONA CONDUCTORA TRANSPORTA Y ACONDICIONA EL AIRE, MIENTRAS QUE EN LA ZONA RESPIRATORIA OCURRE EL INTERCAMBIO GASEOSO.",
                    "C) LA ZONA CONDUCTORA ESTÁ FORMADA ÚNICAMENTE POR LOS PULMONES Y LA ZONA RESPIRATORIA POR LA TRÁQUEA.",
                    "D) LA ZONA CONDUCTORA PRODUCE BICARBONATO Y LA ZONA RESPIRATORIA PRODUCE ANHIDRASA CARBÓNICA.",
                    "E) LA ZONA CONDUCTORA CARECE DE MÚSCULO LISO Y LA ZONA RESPIRATORIA CARECE DE CAPILARES."
                ],
                correct: 1
            },
            {
                question: "LA ESPIRACIÓN TRANQUILA O PASIVA OCURRE PRINCIPALMENTE DEBIDO A:",
                options: [
                    "A) LA CONTRACCIÓN POTENTE DE LOS MÚSCULOS INTERCOSTALES INTERNOS Y EL ABDOMEN.",
                    "B) LA RELAJACIÓN DEL DIAFRAGMA Y EL RETROCESO ELÁSTICO FISIOLÓGICO DEL TEJIDO PULMONAR.",
                    "C) LA DISMINUCIÓN ABRUPTA DEL VOLUMEN DE DIÓXIDO DE CARBONO EN LA SANGRE ARTERIAL.",
                    "D) EL AUMENTO DE LA PRESIÓN ATMOSFÉRICA SOBRE LAS FOSAS NASALES.",
                    "E) LA SECRECIÓN MASIVA DE MOCO POR LAS CÉLULAS CALICIFORMES TRAQUEALES."
                ],
                correct: 1
            },
            {
                question: "RESPECTO AL TRANSPORTE DE OXÍGENO EN LA SANGRE, ¿CUÁL ES LA AFIRMACIÓN CORRECTA SEGÚN EL TEXTO DE REFERENCIA?",
                options: [
                    "A) SE TRANSPORTA TOTALMENTE DISUELTO EN EL PLASMA SANGUÍNEO SIN UNIRSE A CÉLULAS.",
                    "B) SE TRANSPORTA PREDOMINANTEMENTE UNIDO DE FORMA REVERSIBLE A LA HEMOGLOBINA DE LOS ERITROCITOS.",
                    "C) VIAJA UNIDO EXCLUSIVAMENTE AL BICARBONATO Y A LA ANHIDRASA CARBÓNICA.",
                    "D) REQUIERE DE LA DESTRUCCIÓN DE LOS NEUMOCITOS TIPO I PARA SU LIBERACIÓN.",
                    "E) SE TRANSPORTA EN UN NOVENTA POR CIENTO EN FORMA DE CARBOXIHEMOGLOBINA."
                ],
                correct: 1
            },
            {
                question: "¿QUÉ OCURRE CON LA TENSIÓN SUPERFICIAL EN LOS ALVÉOLOS Y LA ESTABILIDAD PULMONAR CUANDO EXISTE UNA ADECUADA PRODUCCIÓN DE SURFACTANTE?",
                options: [
                    "A) LA TENSIÓN SUPERFICIAL DISMINUYE, LO CUAL PREVIENE EL COLAPSO ALVEOLAR Y FACILITA LA VENTILACIÓN.",
                    "B) LA TENSIÓN SUPERFICIAL AUMENTA, PROVOCANDO EL COLAPSO PERMANENTE DE LOS NEUMOCITOS TIPO I.",
                    "C) LA TENSIÓN SUPERFICIAL SE ANULA, IMPIDIENDO LA DIFUSIÓN DE OXÍGENO HACIA LOS CAPILARES.",
                    "D) LA TENSIÓN SUPERFICIAL SE DUPLICA PARA EVITAR LA ENTRADA DE AGUA A LOS PULMONES.",
                    "E) LA TENSIÓN SUPERFICIAL ESTIMULA LA CONTRACCIÓN DE LOS ANILLOS CARTILAGINOSOS TRAQUEALES."
                ],
                correct: 0
            },
            {
                question: "¿CUÁL ES LA FUNCIÓN DEL EPITELIO CILIADO Y LA CAPA DE MOCO PRESENTE EN LA TRÁQUEA Y VÍAS RESPIRATORIAS ALTAS?",
                options: [
                    "A) FACILITAR LA DIFUSIÓN DE DIÓXIDO DE CARBONO HACIA LA ATMÓSFERA SIN PASAR POR LOS ALVÉOLOS.",
                    "B) ATRAPAR PARTÍCULAS EXTRAÑAS Y MOVERLAS MEDIANTE EL BATIDO CILIAR HACIA LA FARINGE PARA SU ELIMINACIÓN.",
                    "C) DEGRADAR LAS MOLÉCULAS DE HEMOGLOBINA QUE ESCAPAN DE LOS CAPILARES.",
                    "D) SINTETIZAR BICARBONATO PARA NEUTRALIZAR LA PRESIÓN ATMOSFÉRICA.",
                    "E) GENERAR DIVERGENCIAS EN EL ÁRBOL BRONQUIAL PARA FORMAR NUEVOS LÓBULOS."
                ],
                correct: 1
            },
            {
                question: "EN LA VENTILACIÓN PULMONAR, SE DEFINE EL CONCEPTO DE \"RESPIRACIÓN FORZADA\" COMO AQUEL PROCESO EN EL CUAL:",
                options: [
                    "A) SOLO PARTICIPA EL RETROCESO ELÁSTICO PULMONAR SIN GASTO ENERGÉTICO.",
                    "B) INTERVIENEN MÚSCULOS ACCESORIOS PARA INCREMENTAR O DISMINUIR AÚN MÁS EL VOLUMEN TORÁCICO.",
                    "C) SE INHIBE POR COMPLETO EL INTERCAMBIO DE GASES EN LOS ALVÉOLOS PULMONARES.",
                    "D) EL AIRE ES TRANSPORTADO ÚNICAMENTE POR DIFUSIÓN SIMPLE SIN CAMBIOS DE PRESIÓN.",
                    "E) SE INTERRUMPE LA PRODUCCIÓN DE SURFACTANTE POR LOS NEUMOCITOS TIPO II."
                ],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 60;
        let timerInterval;
        let audioInit = false;
        let synth;

        function initAudio() {
            if (!audioInit) {
                synth = new Tone.PolySynth(Tone.Synth).toDestination();
                synth.volume.value = -12;
                audioInit = true;
            }
        }

        const sfx = {
            click: () => { if(audioInit) synth.triggerAttackRelease("C6", "32n"); },
            success: () => { if(audioInit) synth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n"); },
            error: () => { if(audioInit) synth.triggerAttackRelease(["C3", "F#2"], "4n"); }
        };

        function startTimer() {
            timeLeft = 60;
            document.getElementById('timer-text').innerHTML = `> TIEMPO RESTANTE: <span class="text-[var(--cyan)]">${timeLeft}s</span>`;
            document.getElementById('timer-bar').style.width = '100%';
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-text').innerHTML = `> TIEMPO RESTANTE: <span class="text-[var(--cyan)]">${timeLeft}s</span>`;
                let percentage = (timeLeft / 60) * 100;
                document.getElementById('timer-bar').style.width = percentage + '%';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1);
                }
            }, 1000);
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                endQuiz();
                return;
            }

            initAudio();
            startTimer();

            const q = questions[currentQuestion];
            document.getElementById('progress-indicator').innerText = `> INTERCEPCIÓN ${currentQuestion + 1} / ${questions.length}`;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 text-left text-xs sm:text-sm font-bold text-gray-200 rounded flex justify-between items-center';
                btn.innerHTML = `<span>${opt}</span><span class="text-xs opacity-50">></span>`;
                btn.onclick = () => {
                    clearInterval(timerInterval);
                    handleAnswer(index, btn);
                };
                optionsContainer.appendChild(btn);
            });
        }

        function handleAnswer(selectedIndex, btnElement) {
            sfx.click();
            const q = questions[currentQuestion];
            const allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => b.disabled = true);

            if (selectedIndex === q.correct) {
                if(btnElement) btnElement.classList.add('selected-correct');
                sfx.success();
                let earnedXP = 100 + (timeLeft * 2);
                score += earnedXP;
            } else {
                if(btnElement) btnElement.classList.add('selected-incorrect');
                if(allBtns[q.correct]) allBtns[q.correct].classList.add('selected-correct');
                sfx.error();
            }

            document.getElementById('score-display').innerText = score;

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 1200);
        }

        function endQuiz() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('timer-text').parentElement.classList.add('hidden');
            document.getElementById('timer-bar').parentElement.classList.add('hidden');
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');

            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const resultDesc = document.getElementById('result-desc');
            const actionContainer = document.getElementById('action-container');

            // Barrera de supervivencia: 750 XP
            if (score >= 750) {
                // GUARDAR PROGRESO PARA DESBLOQUEAR LA FASE 3
                localStorage.setItem('krebs_fase2_respiratorio_ok', 'true');

                resultIcon.className = "w-16 h-16 mx-auto flex items-center justify-center border-2 border-[var(--success)] rounded-full text-2xl font-bold text-[var(--success)] shadow-[0_0_15px_#00FF00]";
                resultIcon.innerText = "✓";
                resultTitle.className = "text-xl sm:text-2xl font-bold tracking-wider text-[var(--success)]";
                resultTitle.innerText = ">> BROTE MUTANTE SUPERADO";
                resultDesc.innerHTML = `Métricas óptimas alcanzadas (<span class="text-[var(--cyan)] font-bold">${score} XP</span>). El acceso a la <span class="text-[var(--magenta)] font-bold">Fase 3 (Efecto Krebs - Nivel Élite)</span> ha sido habilitado en tu sistema.`;
                
                actionContainer.innerHTML = `
                    <a href="index.html" class="block w-full border border-[var(--success)] bg-[var(--success)] text-black font-bold py-4 text-center text-xs uppercase tracking-widest hover:bg-transparent hover:text-[var(--success)] transition-colors">
                        [ VOLVER A LA CENTRAL DE OPERACIONES ]
                    </a>
                `;
            } else {
                resultIcon.className = "w-16 h-16 mx-auto flex items-center justify-center border-2 border-[var(--danger)] rounded-full text-2xl font-bold text-[var(--danger)] shadow-[0_0_15px_#FF0040]";
                resultIcon.innerText = "✕";
                resultTitle.className = "text-xl sm:text-2xl font-bold tracking-wider text-[var(--danger)]";
                resultTitle.innerText = ">> INFECCIÓN NO CONTROLADA";
                resultDesc.innerHTML = `Tu puntaje final fue de <span class="text-[var(--danger)] font-bold">${score} XP</span>. No alcanzaste el umbral de 750 XP requerido para superar el Brote Mutante.`;
                
                actionContainer.innerHTML = `
                    <button onclick="location.reload()" class="w-full border border-[var(--magenta)] bg-transparent text-[var(--magenta)] font-bold py-4 text-center text-xs uppercase tracking-widest hover:bg-[var(--magenta)] hover:text-black transition-colors">
                        [ REINTENTAR PROTOCOLO ]
                    </button>
                `;
            }
        }

        window.addEventListener('click', () => {
            initAudio();
        }, { once: true });

        loadQuestion();
    </script>
</body>
</html>
